<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIバトラー キャラクターカタログ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <div class="top-bar">
      <span id="resultCount" class="result-count">0件</span>
    </div>

    <div id="cards" aria-live="polite"></div>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <div class="dialog-header">
      <div>
        <h2 id="detailTitle"></h2>
        <p id="detailSub"></p>
      </div>
      <button id="closeDialog" class="icon-button" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="detailBody" class="dialog-body"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIバトラー キャラクターカタログ</title>
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <main class="layout">
    <div class="top-bar">
      <span id="resultCount" class="result-count">0件</span>
      <span id="resultAnnounce" class="visually-hidden" role="status" aria-atomic="true"></span>
    </div>

    <div class="view-controls" role="group" aria-label="表示切替">
      <button type="button" class="variant-toggle series-button" data-view="characters" aria-pressed="true">キャラクター一覧</button>
      <button type="button" class="variant-toggle series-button" data-view="places" aria-pressed="false">場所</button>
      <button type="button" class="variant-toggle series-button" data-view="sketches" aria-pressed="false">テッサのスケッチ</button>
      <button type="button" class="variant-toggle series-button" data-view="shop" aria-pressed="false">ハーピィ雑貨店</button>
      <button type="button" class="variant-toggle series-button" data-view="gallery" aria-pressed="false">ギャラリー</button>
    </div>

    <div class="search-block">
      <div class="search-field">
        <input id="search" type="search" placeholder="名前・特徴で検索" aria-label="名前・特徴で検索" autocomplete="off">
        <button id="clearSearch" type="button" aria-label="検索をクリア" hidden>×</button>
      </div>
      <div id="series" class="series-buttons" role="group" aria-label="シリーズで絞り込み"></div>
    </div>

    <div id="cards"></div>
  </main>

  <dialog id="galleryLightbox" role="dialog" aria-modal="true" aria-label="作品画像">
    <button type="button" aria-label="閉じる" autofocus>×</button>
    <img alt="">
    <p></p>
  </dialog>

  <script src="data.js?v=16"></script>
  <script src="gallery_data.js?v=17"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
